<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중국 숏폼 드라마 아카이브</title>
    <meta name="description" content="파인드라마 전체 아카이브입니다.">
    <link rel="canonical" href="https://my-drama-list.com/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <style>
        .drama-card { transition: all 0.2s ease-in-out; cursor: pointer; }
        .drama-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-5">
            <h1 class="text-2xl font-bold text-gray-900 mb-4">🎬 파인드라마 아카이브</h1>
            <input type="text" id="searchInput" 
                class="w-full pl-4 pr-10 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50"
                placeholder="파인드라마 제목, 원어 제목, 배우명 등을 검색해보세요.">
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="loadingIndicator" class="text-center text-gray-500 py-10 animate-pulse">
            데이터를 불러오는 중입니다...
        </div>
        <div id="dramaContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
        </div>
    </main>

    <div id="dramaModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto no-scrollbar relative transform scale-95 transition-transform duration-300" id="modalContentWrapper">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 hover:bg-white text-gray-800 rounded-full p-2 transition backdrop-blur-sm z-10 shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modalContent" class="p-0"></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1P358X3wdxkQOuL4cUOJrOP-xVWhqpxlgV9QbDgl3Xj6oBll4TRuogtSCqkoxsV6H0YhzdyrcLKo8/pub?output=csv';

        let allData = [];
        let currentRenderedData = [];

        document.addEventListener('DOMContentLoaded', () => {
            Papa.parse(csvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    allData = results.data.filter(item => Object.values(item).some(val => val !== "")); 
                    renderCards(allData);
                },
                error: function(err) {
                    document.getElementById('loadingIndicator').innerHTML = '데이터를 불러오는데 실패했습니다.';
                }
            });

            document.getElementById('searchInput').addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase();
                const filtered = allData.filter(item => {
                    return Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
                });
                renderCards(filtered);
            });

            document.getElementById('dramaModal').addEventListener('click', function(e) {
                if(e.target === this) closeModal();
            });
        });

        function renderCards(data) {
            currentRenderedData = data;
            const container = document.getElementById('dramaContainer');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">결과가 없습니다.</p>';
                return;
            }

            data.forEach((item, index) => {
                const keys = Object.keys(item);
                
                const titleKey = keys.find(k => k.includes('작품명') || k.includes('제목') || k.includes('드라마')) || keys[0];
                const title = item[titleKey] || '제목 없음';
                
                let imageUrl = 'https://via.placeholder.com/400x600?text=No+Image'; 
                for (const [key, value] of Object.entries(item)) {
                    if ((key.includes('이미지') || key.includes('포스터')) && value.startsWith('http')) {
                        imageUrl = value;
                        break;
                    }
                }

                let summaryHtml = '';
                let count = 0;
                for (let i = 0; i < keys.length; i++) {
                    const key = keys[i];
                    const value = item[key];
                    // URL 형태인 데이터는 카드 미리보기 요약에서 제외하거나 텍스트로만 간단히 처리
                    if(value && key !== titleKey && !key.includes('이미지') && !key.includes('포스터') && !key.includes('순서') && count < 3) {
                        let displayVal = value;
                        if (value.startsWith('http')) {
                            displayVal = '🔗 링크 바로가기';
                        }
                        summaryHtml += `
                            <div class="flex items-start text-xs sm:text-sm mb-1 sm:mb-1.5">
                                <span class="w-[50px] sm:w-[75px] shrink-0 font-bold text-gray-400 tracking-tight truncate">${key}</span>
                                <span class="text-gray-600 truncate">${displayVal}</span>
                            </div>
                        `;
                        count++;
                    }
                }

                const card = `
                    <div class="bg-white rounded-xl overflow-hidden border border-gray-200 drama-card flex flex-col h-full" onclick="openModal(${index})">
                        <div class="aspect-[3/4] w-full bg-gray-100 overflow-hidden shrink-0 flex justify-center items-center">
                            <img src="${imageUrl}" alt="포스터" class="w-full h-full object-contain">
                        </div>
                        <div class="p-3 sm:p-4 flex-grow">
                            <h3 class="text-sm sm:text-lg font-bold text-gray-800 mb-2 sm:mb-3 line-clamp-2 leading-tight">${title}</h3>
                            <div class="space-y-0.5 sm:space-y-1">
                                ${summaryHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function openModal(index) {
            const item = currentRenderedData[index];
            const keys = Object.keys(item);
            const titleKey = keys.find(k => k.includes('작품명') || k.includes('제목') || k.includes('드라마')) || keys[0];
            const title = item[titleKey] || '제목 없음';

            let imageUrl = '';
            let detailsHtml = '';

            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                const value = item[key];
                
                if (!value || key === titleKey || key.includes('순서')) continue;

                if ((key.includes('이미지') || key.includes('포스터')) && value.startsWith('http')) {
                    imageUrl = value;
                    continue; 
                }

                // ✨ 값이 http로 시작하는 URL 링크 형태라면 클릭 가능한 버튼/링크로 변환
                let contentBody = '';
                if (value.startsWith('http')) {
                    contentBody = `
                        <a href="${value}" target="_blank" rel="noopener noreferrer" 
                           class="inline-flex items-center gap-2 mt-1 px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg shadow-sm transition">
                            <span>🔗 링크 열기 (새창)</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                        </a>
                    `;
                } else {
                    contentBody = `<p class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap">${value}</p>`;
                }

                detailsHtml += `
                    <div class="mb-3 sm:mb-4 bg-gray-50 p-3 rounded-lg border border-gray-100">
                        <span class="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-[10px] sm:text-xs font-bold rounded mb-1.5 sm:mb-2">${key}</span>
                        <div>${contentBody}</div>
                    </div>
                `;
            }

            const finalImage = imageUrl ? `
                <div class="w-full bg-black/5 flex justify-center items-center py-4">
                    <img src="${imageUrl}" alt="포스터" class="max-w-full h-auto max-h-[50vh] sm:max-h-[60vh] object-contain shadow-sm">
                </div>
            ` : '';

            document.getElementById('modalContent').innerHTML = `
                ${finalImage}
                <div class="p-5 sm:p-6 md:p-8">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mb-4 sm:mb-6">${title}</h2>
                    <div class="grid grid-cols-1">
                        ${detailsHtml}
                    </div>
                </div>
            `;

            const modal = document.getElementById('dramaModal');
            const wrapper = document.getElementById('modalContentWrapper');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                wrapper.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('dramaModal');
            const wrapper = document.getElementById('modalContentWrapper');
            
            modal.classList.add('opacity-0');
            wrapper.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
