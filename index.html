<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중국 숏폼 드라마 아카이브</title>
    <meta name="description" content="파인드라마 전체 아카이브입니다. (중복, AI, 애니 제외)">
    <link rel="canonical" href="https://cd-shorts.netlify.app/">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- 이미지 속 텍스트(한글/한자) 인식을 위한 무료 OCR 라이브러리 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        .drama-card { transition: all 0.2s ease-in-out; cursor: pointer; }
        .drama-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-6xl mx-auto px-4 py-5">
            <!-- 타이틀과 우측 끝 방문자 카운터 영역 -->
            <div class="flex items-center justify-between mb-4">
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900">🎬 파인드라마 아카이브</h1>
                <div class="flex items-center gap-1.5 text-xs sm:text-sm text-gray-500 bg-gray-50 border border-gray-200 px-3 py-1.5 rounded-full shadow-2xs">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                    <span>TODAY <strong id="todayVisitorCount" class="font-semibold text-gray-700">0</strong></span>
                </div>
            </div>
            
            <!-- 텍스트 검색창 & 이미지 OCR 검색(카메라) 버튼 영역 -->
            <div class="relative flex items-center">
                <input type="text" id="searchInput" 
                    class="w-full pl-4 pr-12 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 bg-gray-50 text-sm sm:text-base"
                    placeholder="파인드라마 제목, 원어 제목, 독음, 배우명, 이미지 검색 등을 활용해보세요.">
                
                <!-- 숨겨진 파일 업로드 인풋 -->
                <input type="file" id="imageSearchInput" accept="image/*" class="hidden">
                
                <!-- 카메라 아이콘 버튼 -->
                <button onclick="document.getElementById('imageSearchInput').click()" 
                        title="포스터나 자막 캡처 이미지로 내 아카이브 검색"
                        class="absolute right-2.5 p-2 text-gray-500 hover:text-blue-600 hover:bg-blue-50 rounded-full transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    </svg>
                </button>
            </div>

            <!-- ✨ 글자 없는 스틸컷/배우 얼굴 검색용 외부 렌즈 바로가기 바 -->
            <div class="flex flex-wrap items-center justify-between gap-2 mt-2.5 pt-2 border-t border-gray-100 text-xs text-gray-500">
                <span class="text-[11px] sm:text-xs">💡 배우 사진•스틸컷으로 원제를 찾으려면?</span>
                <div class="flex items-center gap-1.5">
                    <a href="https://images.google.com/" target="_blank" rel="noopener noreferrer" 
                       class="inline-flex items-center gap-1 px-2.5 py-1 bg-gray-100 hover:bg-blue-50 hover:text-blue-600 text-gray-700 rounded-md font-medium transition">
                        <span>🔍 구글 렌즈</span>
                    </a>
                    <a href="https://graph.baidu.com/pcpage/index?tpl_from=pc" target="_blank" rel="noopener noreferrer" 
                       class="inline-flex items-center gap-1 px-2.5 py-1 bg-gray-100 hover:bg-blue-50 hover:text-blue-600 text-gray-700 rounded-md font-medium transition">
                        <span>🐼 바이두 이미지 검색</span>
                    </a>
                </div>
            </div>

            <!-- 이미지 분석 진행 상태 표시줄 -->
            <div id="ocrStatus" class="hidden mt-2.5 text-xs sm:text-sm text-blue-700 bg-blue-50 border border-blue-100 px-3.5 py-2 rounded-lg flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <svg class="animate-spin h-4 w-4 text-blue-600 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="ocrStatusText">이미지에서 글자를 추출하고 있습니다⸒⸒⸒ (최대 5~10초 소요)</span>
                </div>
                <button onclick="resetSearch()" class="text-xs font-bold text-blue-600 hover:underline shrink-0 ml-2">초기화</button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8">
        <div id="loadingIndicator" class="text-center text-gray-500 py-10 animate-pulse">
            데이터를 불러오는 중입니다⸒⸒⸒
        </div>
        <div id="dramaContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
        </div>
    </main>

    <div id="dramaModal" class="fixed inset-0 bg-black bg-opacity-60 hidden z-50 flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto no-scrollbar relative transform scale-95 transition-transform duration-300" id="modalContentWrapper">
            <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 hover:bg-white text-gray-800 rounded-full p-2 transition backdrop-blur-sm z-10 shadow-sm">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <div id="modalContent" class="p-0"></div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1P358X3wdxkQOuL4cUOJrOP-xVWhqpxlgV9QbDgl3Xj6oBll4TRuogtSCqkoxsV6H0YhzdyrcLKo8/pub?output=csv';

        let allData = [];
        let currentRenderedData = [];

        document.addEventListener('DOMContentLoaded', () => {
            initVisitorCounter();

            Papa.parse(csvUrl, {
                download: true,
                header: true,
                complete: function(results) {
                    document.getElementById('loadingIndicator').style.display = 'none';
                    allData = results.data.filter(item => Object.values(item).some(val => val !== "")); 
                    renderCards(allData);
                },
                error: function(err) {
                    document.getElementById('loadingIndicator').innerHTML = '데이터를 불러오는데 실패했습니다.';
                }
            });

            // 일반 텍스트 검색 이벤트
            document.getElementById('searchInput').addEventListener('input', (e) => {
                document.getElementById('ocrStatus').classList.add('hidden');
                const keyword = e.target.value.toLowerCase().trim();
                if (!keyword) {
                    renderCards(allData);
                    return;
                }
                const filtered = allData.filter(item => {
                    return Object.values(item).some(val => String(val).toLowerCase().includes(keyword));
                });
                renderCards(filtered);
            });

            // 이미지 업로드 검색 이벤트 (OCR 처리)
            document.getElementById('imageSearchInput').addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const statusDiv = document.getElementById('ocrStatus');
                const statusText = document.getElementById('ocrStatusText');
                const spinner = statusDiv.querySelector('svg');
                
                statusDiv.classList.remove('hidden');
                spinner.classList.remove('hidden');
                statusText.textContent = '이미지에서 드라마 제목/배우를 읽는 중입니다...';

                try {
                    const result = await Tesseract.recognize(file, 'kor+chi_sim');
                    const rawText = result.data.text;

                    const words = rawText
                        .replace(/[^\w\s가-힣\u4e00-\u9fa5]/g, ' ')
                        .split(/\s+/)
                        .filter(w => w.length >= 2);

                    spinner.classList.add('hidden');

                    if (words.length === 0) {
                        statusText.textContent = '글자를 찾지 못했습니다. 글자 없는 사진은 상단의 [구글 렌즈]나 [바이두 이미지 검색]을 이용해 보세요!';
                        return;
                    }

                    const matchedData = [];
                    allData.forEach(item => {
                        const itemString = Object.values(item).join(' ').toLowerCase();
                        let matchScore = 0;
                        words.forEach(word => {
                            if (itemString.includes(word.toLowerCase())) {
                                matchScore += 1;
                            }
                        });
                        if (matchScore > 0) {
                            matchedData.push({ item, score: matchScore });
                        }
                    });

                    matchedData.sort((a, b) => b.score - a.score);
                    const finalResults = matchedData.map(m => m.item);

                    const previewWords = words.slice(0, 4).join(', ');
                    document.getElementById('searchInput').value = previewWords;
                    statusText.textContent = `이미지 인식 완료! 추출된 키워드(${previewWords})로 ${finalResults.length}건의 드라마를 찾았습니다.`;
                    
                    renderCards(finalResults);

                } catch (err) {
                    spinner.classList.add('hidden');
                    statusText.textContent = '이미지 분석 중 오류가 발생했습니다. 다시 시도해 주세요.';
                } finally {
                    e.target.value = '';
                }
            });

            document.getElementById('dramaModal').addEventListener('click', function(e) {
                if(e.target === this) closeModal();
            });
        });

        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('ocrStatus').classList.add('hidden');
            renderCards(allData);
        }

        function initVisitorCounter() {
            const today = new Date().toISOString().slice(0, 10);
            const lastVisitDate = localStorage.getItem('cdrama_last_visit_date');
            
            let baseCount = 142; 
            let storedCount = parseInt(localStorage.getItem('cdrama_today_count') || baseCount);

            if (lastVisitDate !== today) {
                storedCount += 1;
                localStorage.setItem('cdrama_last_visit_date', today);
                localStorage.setItem('cdrama_today_count', storedCount);
            }

            document.getElementById('todayVisitorCount').textContent = storedCount.toLocaleString();
        }

        function renderCards(data) {
            currentRenderedData = data;
            const container = document.getElementById('dramaContainer');
            container.innerHTML = '';

            if(data.length === 0) {
                container.innerHTML = '<p class="col-span-full text-center text-gray-500 py-8">일치하는 드라마가 없습니다.</p>';
                return;
            }

            data.forEach((item, index) => {
                const keys = Object.keys(item);
                
                const titleKey = keys.find(k => k.includes('작품명') || k.includes('제목') || k.includes('드라마')) || keys[0];
                const title = item[titleKey] || '제목 없음';
                
                let imageUrl = 'https://via.placeholder.com/400x600?text=No+Image'; 
                for (const [key, value] of Object.entries(item)) {
                    if ((key.includes('이미지') || key.includes('포스터')) && value.startsWith('http')) {
                        imageUrl = value;
                        break;
                    }
                }

                let summaryHtml = '';
                let count = 0;
                for (let i = 0; i < keys.length; i++) {
                    const key = keys[i];
                    const value = item[key];
                    if(value && key !== titleKey && !key.includes('이미지') && !key.includes('포스터') && !key.includes('순서') && count < 3) {
                        let displayVal = value;
                        if (value.startsWith('http')) {
                            displayVal = '🔗 링크 보기';
                        }
                        summaryHtml += `
                            <div class="flex items-start text-xs sm:text-sm mb-1 sm:mb-1.5">
                                <span class="w-[50px] sm:w-[75px] shrink-0 font-bold text-gray-400 tracking-tight truncate">${key}</span>
                                <span class="text-gray-600 truncate">${displayVal}</span>
                            </div>
                        `;
                        count++;
                    }
                }

                const card = `
                    <div class="bg-white rounded-xl overflow-hidden border border-gray-200 drama-card flex flex-col h-full" onclick="openModal(${index})">
                        <div class="aspect-[3/4] w-full bg-gray-100 overflow-hidden shrink-0 flex justify-center items-center">
                            <img src="${imageUrl}" alt="포스터" class="w-full h-full object-contain">
                        </div>
                        <div class="p-3 sm:p-4 flex-grow">
                            <h3 class="text-sm sm:text-lg font-bold text-gray-800 mb-2 sm:mb-3 line-clamp-2 leading-tight">${title}</h3>
                            <div class="space-y-0.5 sm:space-y-1">
                                ${summaryHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', card);
            });
        }

        function openModal(index) {
            const item = currentRenderedData[index];
            const keys = Object.keys(item);
            const titleKey = keys.find(k => k.includes('작품명') || k.includes('제목') || k.includes('드라마')) || keys[0];
            const title = item[titleKey] || '제목 없음';

            let imageUrl = '';
            let detailsHtml = '';

            for (let i = 0; i < keys.length; i++) {
                const key = keys[i];
                const value = item[key];
                
                if (!value || key === titleKey || key.includes('순서')) continue;

                if ((key.includes('이미지') || key.includes('포스터')) && value.startsWith('http')) {
                    imageUrl = value;
                    continue; 
                }

                detailsHtml += `
                    <div class="mb-3 sm:mb-4 bg-gray-50 p-2 sm:p-3 rounded-lg border border-gray-100">
                        <span class="inline-block px-2 py-1 bg-blue-100 text-blue-800 text-[10px] sm:text-xs font-bold rounded mb-1.5 sm:mb-2">${key}</span>
                        <p class="text-gray-700 text-sm md:text-base leading-relaxed whitespace-pre-wrap">${value}</p>
                    </div>
                `;
            }

            const finalImage = imageUrl ? `
                <div class="w-full bg-black/5 flex justify-center items-center py-4">
                    <img src="${imageUrl}" alt="포스터" class="max-w-full h-auto max-h-[50vh] sm:max-h-[60vh] object-contain shadow-sm">
                </div>
            ` : '';

            document.getElementById('modalContent').innerHTML = `
                ${finalImage}
                <div class="p-5 sm:p-6 md:p-8">
                    <h2 class="text-xl sm:text-2xl font-bold text-gray-900 mb-4 sm:mb-6">${title}</h2>
                    <div class="grid grid-cols-1">
                        ${detailsHtml}
                    </div>
                </div>
            `;

            const modal = document.getElementById('dramaModal');
            const wrapper = document.getElementById('modalContentWrapper');
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                wrapper.classList.remove('scale-95');
            }, 10);
        }

        function closeModal() {
            const modal = document.getElementById('dramaModal');
            const wrapper = document.getElementById('modalContentWrapper');
            
            modal.classList.add('opacity-0');
            wrapper.classList.add('scale-95');
            
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
